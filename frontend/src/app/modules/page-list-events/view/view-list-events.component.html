<div id="topline">
  <app-form-list-events [connector]="connector"></app-form-list-events>
  <button mat-raised-button (click)="insertEvent.emit()" class="primary-button create-btn">
    <mat-icon>add</mat-icon>
    <span>Criar novo evento</span>
  </button>
</div>

<div id="page">
  <lib-event-card-grid
    [data$]="data$"
    (cardInteractionEvent)="openCardEvent.emit($event)"
  ></lib-event-card-grid>
</div>
