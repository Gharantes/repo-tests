<div id="topline">
  <app-form-list-events
    [connector]="connector"
  ></app-form-list-events>
</div>

<div id="page">
  <lib-event-card-grid
    [data$]="data$"
    (cardInteractionEvent)="openCardEvent.emit($event)"
  ></lib-event-card-grid>
</div>

<div id="btn-line">
  <button mat-raised-button (click)="insertEvent.emit()">
    <span>Criar novo evento</span>
    <mat-icon class="material-symbols-outlined">add</mat-icon>
  </button>
</div>
