@if (event$(); as event$) {
  <app-view-event-details
    [event$]="event$"
    [editing]="editing()"
    [openTab]="openTab()"
    [canEdit]="permissions.canEditEvent(event$)"
    [canEditTags]="permissions.canChangeEventTags(event$)"
    [isMember]="permissions.isMemberOf(event$)"
    [connector]="connector"
    (goToParentPageEvent)="goToList()"
    (editEvent)="startEditing()"
    (cancelEditEvent)="cancelEditing()"
    (saveEvent)="save()"
  ></app-view-event-details>
}
