<mat-form-field class="field" [appearance]="'outline'" subscriptSizing="dynamic">
  <mat-label>Título</mat-label>
  <input type="text" matInput [formControl]="connector.form.controls.title">
</mat-form-field>

<div class="group">
  <span class="group-label">Disponível para</span>
  <mat-checkbox [formControl]="connector.form.controls.forProjects">Disponível para Projetos</mat-checkbox>
  <mat-checkbox [formControl]="connector.form.controls.forEvents">Disponível para Eventos</mat-checkbox>
  <mat-checkbox [formControl]="connector.form.controls.forAccounts">Disponível para Usuários</mat-checkbox>
</div>
