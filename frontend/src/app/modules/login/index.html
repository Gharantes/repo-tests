<div id="form">
  @if (tenantSelecionado() !== null) {
    <div id="tenant-label">
      <b>Tenant:</b>
      {{ tenantSelecionado()?.title }}
    </div>
  }

    <mat-form-field [appearance]="'outline'" class="field">
        <mat-label>Usuário</mat-label>
        <input matInput type="text" [formControl]="form.controls.user">
    </mat-form-field>

    <mat-form-field [appearance]="'outline'" class="field">
        <mat-label>Senha</mat-label>
        <input matInput type="password" [formControl]="form.controls.password">
    </mat-form-field>

    <div id="buttons-container">
        <button 
            class="login-button"
            matRipple 
            [disabled]="!form.valid"
            (click)="attemptLogin()">
            Login
        </button>
    </div>
</div>

<app-tenant-picker-login
[tenants]="listaTenants()"
(setNewTenant)="setNewTenant($event)"
></app-tenant-picker-login>
