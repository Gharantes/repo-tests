<div id="banner">
  <lib-safe-image
    [url]="project$.bannerUrl"
    [altColor]="project$.bannerColor"
  ></lib-safe-image>
</div>

<div id="two-col">
  <div id="main-col">
    <h2 id="project-title">{{ project$.title }}</h2>

    <div class="section">
      <div class="section-header">Descrição</div>
      <p class="section-body">{{ project$.description }}</p>
    </div>
  </div>

  <div id="info-sidebar">
    <!-- right sidebar content will go here -->
  </div>
</div>
