@if (project$(); as project) {
  <app-view-project-details
    [project$]="project"
    [editing]="editing()"
    [openTab]="openTab()"
    [canEdit]="permissions.canEditProject(project)"
    [canEditTags]="permissions.canChangeProjectTags(project)"
    [isMember]="permissions.isMemberOf(project)"
    [connector]="connector"
    (goToParentPageEvent)="goToList()"
    (editEvent)="startEditing()"
    (cancelEditEvent)="cancelEditing()"
    (saveEvent)="save()"
  ></app-view-project-details>
}
