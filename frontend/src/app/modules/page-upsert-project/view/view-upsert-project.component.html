<div class="page">
  <div class="scroll">
    <app-project-cover-field [connector]="connector"></app-project-cover-field>

    <div class="doc">
      <nav class="crumbs">
        <button type="button" (click)="goToParentPageEvent.emit()">Projetos</button>
        <mat-icon>chevron_right</mat-icon>
        <span>Novo projeto</span>
      </nav>

      <app-project-form-fields [connector]="connector"></app-project-form-fields>
    </div>
  </div>

  <footer class="bar">
    <span class="status">
      <span class="pip" [class.ok]="connector.form.valid"></span>
      {{ connector.form.valid ? 'Pronto para salvar' : 'Título e descrição são obrigatórios' }}
      <span class="count">· {{ descLength }} caracteres</span>
    </span>
    <button mat-button type="button" (click)="goToParentPageEvent.emit()">Voltar</button>
    <button mat-flat-button class="save" type="button" [disabled]="!connector.form.valid" (click)="save()">Salvar</button>
  </footer>
</div>
