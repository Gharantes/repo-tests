<app-form-upsert-project
  [connector]="connector"
  [tags]="tags"
  (saveEvent)="saveEvent.emit()"
  (goToParentPageEvent)="goToParentPageEvent.emit()"
></app-form-upsert-project>

<div class="btn-line">
  <button mat-raised-button (click)="goToParentPageEvent.emit()">Voltar</button>
  <button
    mat-raised-button
    [disabled]="!connector.form.valid"
    (click)="saveEvent.emit()">
    Salvar
  </button>
</div>
