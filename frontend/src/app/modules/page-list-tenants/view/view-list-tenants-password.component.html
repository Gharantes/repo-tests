<div class="auth-card">
  <h1 class="auth-title">Listar Tenants</h1>

  <mat-form-field [appearance]="'outline'">
    <mat-label>Senha</mat-label>
    <input
      matInput
      type="password"
      autocomplete="off"
      [formControl]="connector.form.controls.password"
      (keydown.enter)="submit()">
  </mat-form-field>

  <button class="auth-primary-button" matRipple [disabled]="!canSubmit()" (click)="submit()">Entrar</button>
  <button mat-stroked-button class="auth-secondary-button" (click)="goBackEvent.emit()">Voltar</button>
</div>
