@if (isUnlocked()) {
  <app-view-list-tenants
    [tenants]="tenants()"
    [deletingId]="deletingId()"
    (deleteTenantEvent)="deleteTenant($event)"
    (goToTenantEvent)="routingService.goToLogin($event)"
    (goBackEvent)="goBackEvent.emit()"
  ></app-view-list-tenants>
} @else {
  <app-view-list-tenants-password
    [connector]="connector"
    [isSubmitting]="isSubmitting()"
    (submitEvent)="checkPassword()"
    (goBackEvent)="goBackEvent.emit()"
  ></app-view-list-tenants-password>
}
