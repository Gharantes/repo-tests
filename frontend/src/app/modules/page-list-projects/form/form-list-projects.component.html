<div id="form">
  <mat-form-field [appearance]="'outline'" class="field">
    <mat-label>Título</mat-label>
    <input type="text" matInput [formControl]="connector.form.controls.text"/>
  </mat-form-field>

  <div id="tags-container">
    <mat-chip-set>
      @for (tag of connector.form.controls.tags.value; track tag.id) {
        <mat-chip [removable]="true" (removed)="removeTag(tag)">
          {{ tag.title }}
          <button matChipRemove [attr.aria-label]="'remove'">
            <mat-icon>cancel</mat-icon>
          </button>
        </mat-chip>
      }
    </mat-chip-set>
    <lib-add-tag-btn [forProjects]="true" (saveTagEvent)="saveTag($event)"></lib-add-tag-btn>
  </div>
</div>
