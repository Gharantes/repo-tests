<div id="topline">
  <app-form-list-projects [connector]="connector"></app-form-list-projects>
  <button mat-raised-button (click)="createProjectEvent.emit()" class="primary-button create-btn">
    <mat-icon>add</mat-icon>
    <span>Criar novo projeto</span>
  </button>
</div>

<div id="page">
  <lib-project-card-grid
    [data$]="data$"
    (cardInteractionEvent)="openCardEvent.emit($event)"
  ></lib-project-card-grid>
</div>
