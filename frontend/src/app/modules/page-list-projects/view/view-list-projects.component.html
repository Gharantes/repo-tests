<div id="topline">
  <app-form-list-projects
    [connector]="connector"
  ></app-form-list-projects>
</div>

<div id="page">
  <lib-project-card-grid
    [data$]="data$"
    (cardInteractionEvent)="openCardEvent.emit($event)"
  ></lib-project-card-grid>
</div>

<div id="btn-line">
  <button mat-raised-button (click)="createProjectEvent.emit()">
    <span>Criar novo projeto</span>
    <mat-icon class="material-symbols-outlined">add</mat-icon>
  </button>
</div>
