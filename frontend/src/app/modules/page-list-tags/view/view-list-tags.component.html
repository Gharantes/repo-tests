<div id="topline">
  <mat-form-field class="field" [appearance]="'outline'">
    <mat-label>Nome</mat-label>
    <input type="text" matInput [formControl]="connector.textFieldControl" />
  </mat-form-field>
</div>

<div id="page">
  <lib-sig-extendable-table
    [actions]="actions"
    [columns]="columns"
    [data$]="data$"
  ></lib-sig-extendable-table>
</div>

<div id="btn-line">
  <button mat-raised-button (click)="createTagEvent.emit()" class="primary-button">
    <span>Criar nova Tag</span>
    <mat-icon class="material-symbols-outlined">add</mat-icon>
  </button>
</div>
