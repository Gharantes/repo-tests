<mat-form-field [appearance]="'outline'">
  <mat-label>Nome</mat-label>
  <input type="text" matInput [formControl]="connector.form.controls.firstName" autocomplete="new-password"/>
</mat-form-field>

<mat-form-field [appearance]="'outline'">
  <mat-label>Sobrenome</mat-label>
  <input type="text" matInput [formControl]="connector.form.controls.lastName" autocomplete="new-password"/>
</mat-form-field>

<mat-form-field [appearance]="'outline'">
  <mat-label>Username</mat-label>
  <input type="text" matInput [formControl]="connector.form.controls.login" autocomplete="new-password"/>
</mat-form-field>

<mat-form-field [appearance]="'outline'">
  <mat-label>Email</mat-label>
  <input type="text" matInput [formControl]="connector.form.controls.email" autocomplete="new-password"/>
</mat-form-field>

<mat-form-field [appearance]="'outline'">
  <mat-label>Senha</mat-label>
  <input type="password" matInput [formControl]="connector.form.controls.password" autocomplete="new-password"/>
</mat-form-field>

<div id="tags-container">
  <mat-chip-set>
    @for (tag of connector.form.controls.tags.value; track tag.id) {
      <mat-chip [removable]="true" (removed)="removeTag(tag)">
        {{ tag.title }}
        <button matChipRemove [attr.aria-label]="'remove'">
          <mat-icon>cancel</mat-icon>
        </button>
      </mat-chip>
    }
  </mat-chip-set>

  <lib-add-tag-btn
    [forAccounts]="true"
    (saveTagEvent)="saveTag($event)"
  ></lib-add-tag-btn>
</div>
