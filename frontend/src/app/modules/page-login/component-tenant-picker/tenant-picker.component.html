<div id="tenant-list-container">
  <div id="tenant-list-iterator">
    @for (item of tenants; track $index) {
      <button matRipple class="tenant-option" (click)="selectTenantEvent.emit(item)">
        {{item.title}}
      </button>
    }
  </div>
  <button id="create-new-tenant-option" (click)="createTenantEvent.emit()">
    Criar Novo Tenant
  </button>
</div>
