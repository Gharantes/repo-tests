<div class="auth-card">
  <h1 class="auth-title">Login</h1>

  <app-form-login [connector]="connector"></app-form-login>

  <button
    class="auth-primary-button"
    matRipple
    [disabled]="!connector.form.valid"
    (click)="attemptLoginEvent.emit()">
    Login
  </button>

  <button mat-stroked-button class="auth-secondary-button" id="create-new-tenant-option" (click)="createTenantEvent.emit()">
    Criar Novo Tenant
  </button>
</div>
