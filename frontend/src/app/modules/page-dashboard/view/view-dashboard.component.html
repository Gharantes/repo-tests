<div id="page">
  <div class="section">
    <div class="section-title">Notificações</div>
    <app-dashboard-notifications
      [items]="notifications$"
      [loaded]="notificationsLoaded"
      (openEvent)="openNotificationEvent.emit($event)"
      (markReadEvent)="markReadEvent.emit($event)"
      (markAllEvent)="markAllReadEvent.emit()"
      (acceptEvent)="acceptRequestEvent.emit($event)"
      (declineEvent)="declineRequestEvent.emit($event)"
    ></app-dashboard-notifications>
  </div>

  <div class="section">
    <div class="section-title">Seus Projetos</div>
    <lib-project-card-grid
      [data$]="projects$"
      (cardInteractionEvent)="openProjectEvent.emit($event)"
    >
      @if (permissions.has(P.CREATE_PROJECT)) {
        <button class="create-widget" (click)="createProjectEvent.emit()">
          <mat-icon>add</mat-icon>
          <span>Criar Projeto</span>
        </button>
      }
    </lib-project-card-grid>
  </div>

  <div class="section">
    <div class="section-title">Seus Eventos</div>
    <lib-event-card-grid
      [data$]="events$"
      (cardInteractionEvent)="openEventEvent.emit($event)"
    >
      @if (permissions.has(P.CREATE_EVENT)) {
        <button class="create-widget" (click)="createEventEvent.emit()">
          <mat-icon>add</mat-icon>
          <span>Criar Evento</span>
        </button>
      }
    </lib-event-card-grid>
  </div>
</div>
