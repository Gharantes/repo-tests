<div id="topline">
  <app-form-list-accounts [connector]="connector"></app-form-list-accounts>
</div>

<div id="page">
  <lib-sig-extendable-table
    [data$]="data$"
    [columns]="columns"
    [actions]="tableActions"
  ></lib-sig-extendable-table>
</div>

<div id="btn-line">
  <button mat-raised-button (click)="createAccountEvent.emit()" class="primary-button">
    <span>Criar novo usuário</span>
    <mat-icon class="material-symbols-outlined">add</mat-icon>
  </button>
</div>
