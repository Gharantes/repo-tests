<div id="topline">
  <lib-filtro-page-listar-eventos></lib-filtro-page-listar-eventos>

  <button mat-raised-button (click)="toNewEventPage()">
    <span>Criar novo evento</span>
    <mat-icon class="material-symbols-outlined">add</mat-icon>
  </button>

  <button (click)="switchDisplayType()">A</button>
</div>

@if (activeDisplayType === 'GRID') {
  <lib-card-grid
    style="margin-top: 5px;"
    [data$]="cardGridData$()"
    (cardInteractionEvent)="cardInteraction($event)"
  ></lib-card-grid>
} @else {
  <lib-sig-extendable-table
    [data$]="data$"
    [columns]="tableColumns"
    [actions]="tableActions"
  ></lib-sig-extendable-table>
}
