<div class="card" (click)="interact('CARD')">
  <div class="banner" (click)="interact('BANNER')">
    <lib-safe-image
      [url]="entry.urlBanner"
      [altColor]="entry.backgroundColor"
    ></lib-safe-image>
  </div>

  <div class="card-information">
    <div class="card-primary" (click)="interact('PRIMARY')">{{ entry.primary }}</div>
    <div class="card-secondary" (click)="interact('SECONDARY')">{{ entry.secondary }}</div>
  </div>
</div>
