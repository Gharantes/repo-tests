<table id="table" mat-table [dataSource]="data$">
  <ng-container *ngFor="let column of columns" [matColumnDef]="column.def">
    <th mat-header-cell *matHeaderCellDef>{{ column.header }}</th>
    <td mat-cell *matCellDef="let element">
      @if (column.special === 'BOOLEAN') {
        <mat-checkbox [checked]="column.value(element)" [disabled]="true"></mat-checkbox>
      } @else {
        {{ column.value(element) }}
      }
    </td>
  </ng-container>
  
  <ng-container [matColumnDef]="'actions'">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let element" class="actions-btn-cell">
      <div [matMenuTriggerFor]="actionsMenu" class="expand-action-menu-btn">
        <lib-gm-icon
          [type]="'rounded'"
          [image]="'more_vert'"    
        ></lib-gm-icon>
      </div>
      <mat-menu #actionsMenu="matMenu">
        @for (item of actions; track $index) {
          <button mat-menu-item type="button" (click)="item.action(element)">
            <span>{{ item.label }}</span>
          </button>
        }
      </mat-menu>
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
