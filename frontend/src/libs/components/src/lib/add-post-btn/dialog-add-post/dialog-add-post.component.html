<div id="container">
  <mat-form-field [appearance]="'outline'" class="field">
    <mat-label>Título</mat-label>
    <input type="text" matInput [formControl]="postTitleControl">
  </mat-form-field>

  <mat-form-field [appearance]="'outline'" class="field textarea-container">
    <mat-label>Conteúdo</mat-label>
    <textarea class="textarea"
      matInput
      cdkTextareaAutosize
      [formControl]="postContentControl"
    ></textarea>
  </mat-form-field>

  <div id="button-container">
    <button mat-raised-button class="cancel-btn" (click)="close()">
      Cancelar
      <mat-icon>clear</mat-icon>
    </button>

    <button mat-raised-button class="save-btn" (click)="publishPost()">
      Enviar
      <mat-icon>check</mat-icon>
    </button>
  </div>
</div>
