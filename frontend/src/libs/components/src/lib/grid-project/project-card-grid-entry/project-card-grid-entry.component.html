<div class="card" (click)="cardInteractionEvent.emit(entry)">
  <div class="banner">
    <lib-safe-image
      [url]="entry.bannerUrl"
      [altColor]="entry.bannerColor"
    ></lib-safe-image>
  </div>

  <div class="card-information">
    <div class="card-primary">{{ entry.title }}</div>
    <div class="card-tags">
      @for (tag of entry.tags; track tag.id) {
        <span class="tag">{{ tag.title }}</span>
      }
    </div>
  </div>
</div>
