# Deploy contínuo do Synergia no Render: backend (Web Service) e frontend (Static Site).
#
# A cada push na main (ou seja, a cada PR aceito):
#
#   verificar-backend   ->  testes de unidade + build da imagem Docker (a mesma que o Render constrói)
#   verificar-frontend  ->  build de produção do Angular (o mesmo que o Render roda)
#   deploy              ->  só se as duas verificações passarem: dispara o Deploy Hook de cada
#                           serviço e confere que ele está respondendo
#
# Configuração (uma vez só, ver tests/README.md):
#   - no Render, desligar o Auto-Deploy dos dois serviços, para que só este workflow publique;
#   - secret RENDER_DEPLOY_HOOK_URL: Deploy Hook do backend;
#   - secret RENDER_FRONTEND_DEPLOY_HOOK_URL: Deploy Hook do frontend;
#   - secret RENDER_API_KEY (opcional): com ela o job espera cada deploy terminar e
#     falha se o Render falhar.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys nunca rodam em paralelo nem são cancelados no meio: o segundo espera.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verificar-backend:
    name: Verificar o backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Instalar JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Testes de unidade
        working-directory: backend
        run: ./gradlew unitTest --no-daemon

      # O Render constrói a partir do backend/Dockerfile. Se a imagem não
      # constrói aqui, também não construiria lá - melhor descobrir antes.
      - name: Construir a imagem Docker
        run: docker build --tag synergia-backend:${{ github.sha }} backend

  verificar-frontend:
    name: Verificar o frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build de produção
        working-directory: frontend
        run: npx nx build synergia-frontend --configuration=production

  deploy:
    name: Publicar o ${{ matrix.nome }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verificar-backend, verificar-frontend]
    strategy:
      # Um lado falhar não aborta o deploy do outro no meio do caminho.
      fail-fast: false
      matrix:
        include:
          - nome: backend
            hook: RENDER_DEPLOY_HOOK_URL
            url: https://repo-tests.onrender.com
            fumaca: https://repo-tests.onrender.com/api/entity-tenant/list-all-tenants
            metodo: POST
          - nome: frontend
            hook: RENDER_FRONTEND_DEPLOY_HOOK_URL
            url: https://repo-tests-frontend.onrender.com
            fumaca: https://repo-tests-frontend.onrender.com
            metodo: GET
    environment:
      name: producao-${{ matrix.nome }}
      url: ${{ matrix.url }}
    steps:
      - name: Disparar o Deploy Hook
        id: hook
        env:
          HOOK: ${{ secrets[matrix.hook] }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Secret ${{ matrix.hook }} não configurado (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          resposta=$(curl -fsS -X POST "$HOOK")
          echo "Resposta do Render: $resposta"
          echo "deploy_id=$(echo "$resposta" | jq -r '.deploy.id // empty')" >> "$GITHUB_OUTPUT"
          # A URL do hook é https://api.render.com/deploy/<id-do-serviço>?key=...
          echo "service_id=$(echo "$HOOK" | sed -E 's#.*/deploy/([^?]+).*#\1#')" >> "$GITHUB_OUTPUT"

      - name: Esperar o deploy terminar
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ steps.hook.outputs.service_id }}
          DEPLOY_ID: ${{ steps.hook.outputs.deploy_id }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$DEPLOY_ID" ]; then
            echo "Sem RENDER_API_KEY (ou sem id do deploy): acompanhe o deploy pelo painel do Render."
            exit 0
          fi
          for i in $(seq 1 90); do
            status=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" | jq -r '.status')
            echo "[$((i * 10))s] $status"
            case "$status" in
              live) exit 0 ;;
              *failed|canceled|deactivated) echo "::error::Deploy terminou com status $status."; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::O deploy não terminou em 15 minutos."
          exit 1

      # O plano gratuito do Render "dorme" o backend: a primeira resposta pode
      # levar mais de um minuto, por isso a espera é longa.
      - name: Teste de fumaça em produção
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -m 120 -o /dev/null -X ${{ matrix.metodo }} "${{ matrix.fumaca }}"; then
              echo "${{ matrix.url }} respondendo."
              exit 0
            fi
            sleep 10
          done
          echo "::error::${{ matrix.url }} não respondeu depois do deploy."
          exit 1
