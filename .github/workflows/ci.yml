# Pipeline de integração contínua do Synergia.
#
# Roda as três camadas de teste da parte 2 a cada push e a cada pull request:
#
#   unidade (JDK)  ->  integração (+ PostgreSQL)  ->  sistema (+ backend e frontend no ar)
#
# As camadas caras dependem da barata: se um teste de unidade quebra, nem faz
# sentido levantar Postgres, backend, Angular e navegador para descobrir que
# tudo quebrou junto. O job final `resultado` existe para dar à proteção da
# branch main um único check obrigatório (parte 4).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Um push novo na mesma branch cancela a execução anterior: o que interessa é o
# último commit, não a fila inteira.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'
  # Credenciais do PostgreSQL efêmero dos jobs. Não são segredo: o banco nasce
  # e morre dentro da execução, e não existe fora dela.
  PGUSER_CI: synergia
  PGPASSWORD_CI: synergia

jobs:
  # ---------------------------------------------------------------------------
  # 1. Unidade - segundos, sem infraestrutura.
  # ---------------------------------------------------------------------------
  testes-unitarios:
    name: Testes de unidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Rodar os testes de unidade
        working-directory: backend
        run: ./gradlew unitTest --no-daemon

      - name: Guardar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-unidade
          path: backend/build/reports/tests/unitTest
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Integração - sobe a aplicação real contra um PostgreSQL real.
  # ---------------------------------------------------------------------------
  testes-integracao:
    name: Testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: testes-unitarios

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synergia
          POSTGRES_PASSWORD: synergia
          POSTGRES_DB: synergia_test
        ports:
          - 5432:5432
        # Sem isso o job começa antes de o banco aceitar conexão.
        options: >-
          --health-cmd "pg_isready -U synergia -d synergia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # As mesmas variáveis que o README manda usar na máquina de
      # desenvolvimento. O esquema é criado pelo Hibernate (`ddl-auto: update`),
      # então não há passo de migração aqui.
      - name: Rodar os testes de integração
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/synergia_test
          TEST_DB_USERNAME: synergia
          TEST_DB_PASSWORD: synergia
        run: ./gradlew integrationTest --no-daemon

      - name: Guardar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-integracao
          path: backend/build/reports/tests/integrationTest
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Sistema - Postgres + backend + Angular + navegador, a pilha inteira.
  # ---------------------------------------------------------------------------
  testes-sistema:
    name: Testes de sistema (Cypress)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: testes-unitarios

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synergia
          POSTGRES_PASSWORD: synergia
          POSTGRES_DB: synergia_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synergia -d synergia_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      E2E_DB_URL: jdbc:postgresql://localhost:5432/synergia_e2e
      E2E_DB_USERNAME: synergia
      E2E_DB_PASSWORD: synergia
      # 127.0.0.1 e não localhost: tira a resolução de nome da jogada,
      # que é justamente onde a suíte tropeçou.
      CYPRESS_BASE_URL: http://127.0.0.1:4201
      CYPRESS_API_URL: http://127.0.0.1:8080

    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Instalar Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # O binário do Cypress (~250 MB) mora fora de node_modules e não é
      # coberto pelo cache do npm.
      - name: Cache do binário do Cypress
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: cypress-${{ runner.os }}-

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      # Falha aqui é problema de ambiente (biblioteca do Electron faltando na
      # imagem do runner), não de teste. Melhor descobrir agora, em 5 segundos,
      # do que depois de subir Postgres, backend e Angular.
      - name: Verificar a instalação do Cypress
        working-directory: frontend
        run: npx cypress verify

      # Empacotar e rodar o .jar em vez de `bootRun`: o processo fica sob
      # controle do script (PID conhecido, log num arquivo) em vez de ficar
      # pendurado num daemon do Gradle.
      - name: Empacotar o backend
        working-directory: backend
        run: ./gradlew bootJar --no-daemon -x test

      # Subir a pilha e rodar o Cypress no MESMO passo, de propósito: cada
      # `run:` do Actions é um shell próprio, e servidor deixado em segundo
      # plano não sobrevive de forma confiável à virada do passo.
      #
      # Duas escolhas aqui vêm de falha real, não de precaução (seção 6.2 do
      # response-03):
      #
      #   --host 0.0.0.0  - sem isso o dev-server escuta no endereço em que
      #                     "localhost" resolver. No runner o localhost também
      #                     aponta para ::1, e o servidor pode acabar escutando
      #                     só em [::1]:4201 - enquanto o Cypress conecta em
      #                     127.0.0.1:4201 e leva ECONNREFUSED.
      #   curl -4         - a verificação passa a usar a mesma pilha e o mesmo
      #                     endereço do Cypress. Antes ela subia por IPv6 e
      #                     dizia "no ar" enquanto o Cypress não alcançava nada.
      - name: Subir a pilha e rodar os testes de sistema
        env:
          NX_DAEMON: 'false'
        run: |
          set -e

          derrubar() {
            for pid in "$BACKEND_PID" "$FRONTEND_PID"; do
              [ -n "$pid" ] && kill "$pid" 2>/dev/null || true
            done
          }
          trap derrubar EXIT

          # Fotografia do estado da pilha. Serve para que qualquer falha futura
          # seja diagnosticada pelo log do próprio job, sem chute: diz se os
          # processos continuam vivos, em que endereço cada um escuta, quanta
          # memória sobrou e se o kernel matou alguém por falta dela.
          diagnostico() {
            echo "::group::Diagnóstico da pilha ($1)"
            kill -0 "$BACKEND_PID" 2>/dev/null && echo "backend: vivo (pid $BACKEND_PID)" || echo "backend: MORTO"
            kill -0 "$FRONTEND_PID" 2>/dev/null && echo "frontend: vivo (pid $FRONTEND_PID)" || echo "frontend: MORTO"
            echo "-- portas --"
            ss -tlnp 2>/dev/null | grep -E ':(4201|8080)' || echo "nada escutando em 4201 nem 8080"
            echo "-- memória (MB) --"
            free -m
            echo "-- kernel matou algo por falta de memória? --"
            sudo -n dmesg 2>/dev/null | grep -iE "killed process|out of memory" | tail -5 || echo "nenhum registro de OOM"
            echo "::endgroup::"
          }

          echo "::group::Subindo o backend (perfil e2e)"
          jar=$(ls backend/build/libs/*.jar | grep -v -- '-plain.jar' | head -n 1)
          echo "Subindo $jar"
          java -Xmx768m -jar "$jar" --spring.profiles.active=e2e > "$RUNNER_TEMP/backend.log" 2>&1 &
          BACKEND_PID=$!
          echo "::endgroup::"

          echo "::group::Subindo o frontend"
          (cd frontend && npx nx serve synergia-frontend --port 4201 --host 0.0.0.0) > "$RUNNER_TEMP/frontend.log" 2>&1 &
          FRONTEND_PID=$!
          echo "::endgroup::"

          # Espera pelos dois em paralelo: o Angular compila enquanto o Spring
          # sobe. A verificação do backend é uma chamada de verdade à API, que
          # só responde depois que ele conectou no banco.
          esperar() {
            local nome="$1" url="$2" metodo="$3" log="$4"
            for i in $(seq 1 60); do
              if curl -4 -fsS -X "$metodo" "$url" > /dev/null; then
                echo "$nome no ar depois de ${i}0s."
                return 0
              fi
              sleep 10
            done
            echo "::error::$nome não respondeu em 10 minutos."
            diagnostico "espera esgotada"
            tail -n 100 "$log"
            return 1
          }

          esperar "Backend" "http://127.0.0.1:8080/api/entity-tenant/list-all-tenants" POST "$RUNNER_TEMP/backend.log"
          esperar "Frontend" "http://127.0.0.1:4201" GET "$RUNNER_TEMP/frontend.log"

          diagnostico "antes dos testes"

          # Spec de fumaça antes da suíte inteira.
          #
          # Quando a pilha não está de pé, os 50 testes falham um a um, cada um
          # com uma nova tentativa em cima - foram 9 minutos de log vermelho
          # para dizer o que o primeiro teste já tinha dito. Rodando
          # `autenticacao.cy.ts` sozinho e sem retentativa, esse caso morre em
          # ~30 segundos, com o diagnóstico junto.
          #
          # O preço é rodar esse spec duas vezes quando está tudo verde (~25s).
          echo "::group::Cypress - spec de fumaça"
          if ! (cd frontend && npx cypress run --e2e --browser electron \
                  --spec cypress/e2e/autenticacao.cy.ts --config retries=0); then
            echo "::endgroup::"
            echo "::error::O primeiro spec falhou inteiro. Abortando antes dos outros 44 testes."
            diagnostico "depois da falha do spec de fumaça"
            tail -n 40 "$RUNNER_TEMP/frontend.log"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Cypress - suíte completa"
          if ! (cd frontend && npm run e2e); then
            echo "::endgroup::"
            diagnostico "depois da falha"
            tail -n 40 "$RUNNER_TEMP/frontend.log"
            exit 1
          fi
          echo "::endgroup::"

      # Quando um teste falha, o que explica a falha está ou na captura de tela
      # do Cypress ou no log de quem estava do outro lado.
      - name: Guardar as capturas de tela
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-cypress
          path: frontend/cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar os logs do backend e do frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-sistema
          path: |
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/frontend.log
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 4. Resultado - o único check obrigatório na proteção da main.
  # ---------------------------------------------------------------------------
  resultado:
    name: Resultado dos testes
    runs-on: ubuntu-latest
    if: always()
    needs: [testes-unitarios, testes-integracao, testes-sistema]
    steps:
      - name: Conferir as três camadas
        run: |
          echo "unidade....: ${{ needs.testes-unitarios.result }}"
          echo "integração.: ${{ needs.testes-integracao.result }}"
          echo "sistema....: ${{ needs.testes-sistema.result }}"
          if [ "${{ needs.testes-unitarios.result }}" != "success" ] \
            || [ "${{ needs.testes-integracao.result }}" != "success" ] \
            || [ "${{ needs.testes-sistema.result }}" != "success" ]; then
            echo "::error::Alguma camada de teste não passou."
            exit 1
          fi
          echo "As três camadas passaram."
