# JVM em que o daemon do Gradle roda (não confundir com o alvo de compilação,
# que fica no build.gradle.kts).
#
# O Gradle 8.10 só entende versões de Java até a 22. Numa máquina com JDK 25 no
# PATH, qualquer tarefa morre com uma mensagem sem contexto nenhum - só o número
# da versão, tipo "* What went wrong: 25.0.4". Fixando a 21 aqui, o daemon usa o
# JDK 21 já instalado (o mesmo que o CI instala) independentemente do que o
# `java -version` da máquina responder.
toolchainVersion=21
