# JVM em que o daemon do Gradle roda (não confundir com o alvo de compilação,
# que é a toolchain declarada no build.gradle.kts).
#
# Fixar aqui deixa o build determinístico: o daemon usa esta versão qualquer que
# seja a resposta do `java -version` da máquina, e é a mesma que o CI instala.
# Sem isso, trocar o JDK padrão da máquina pode derrubar o build inteiro com uma
# mensagem sem contexto - foi o que aconteceu com o Gradle 8.10 diante do JDK 25.
toolchainVersion=25
