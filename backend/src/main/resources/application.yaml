server:
  port: 8080
  # Em produção o backend fica atrás do proxy do Render. Com isto, request.remoteAddr
  # passa a ser o IP do cliente (lido do X-Forwarded-For que o proxy interno manda),
  # e não o IP do proxy. O limite de cadastro de instituições depende disso.
  forward-headers-strategy: native
synergia:
  # Anti-robô: cada IP cria no máximo `maximo` instituições a cada `janela-minutos`.
  # 0 desliga (perfil e2e). Ver config/limite/LimiteCadastroInstituicaoConfig.kt.
  limite-cadastro-instituicao:
    maximo: ${LIMITE_CADASTRO_INSTITUICAO:10}
    janela-minutos: 60
  # Anti-força bruta no login (ver config/limite/ProtecaoForcaBruta.kt). Só senhas
  # erradas contam: depois de `falhas-por-conta` erros, aquele login trava até a
  # janela passar; `falhas-por-ip` soma os erros de todos os logins de um IP.
  limite-login:
    falhas-por-conta: 5
    falhas-por-ip: 30
    janela-minutos: 15
  # Senha da página de instituições (listar e excluir instituições).
  limite-senha-instituicoes:
    falhas-por-ip: 5
    janela-minutos: 15
spring:
  application:
    name: synergia
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
  output:
    ansi:
      enabled: always
  config:
    import:
      # Variáveis locais (ex.: LIST_TENANT_PAGE_PASSWORD). Ver .env.example.
      - "optional:file:.env[.properties]"
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    name: ${DATABASE_NAME}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
      generate-ddl: true
springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  disable-i18n: true
  model-converters:
    pageable-converter:
      enabled: true
  show-actuator: false
  api-docs:
    groups:
      enabled: true
