# Perfil usado pelos testes de sistema (Cypress).
#
# Aponta a aplicação para o banco `synergia_e2e`, separado do `synergia_dev`,
# para que rodar a suíte ponta a ponta nunca mexa nos dados de desenvolvimento.
#
# Usuário e senha vêm de E2E_DB_USERNAME / E2E_DB_PASSWORD, sem valor padrão: se
# faltarem, o backend não sobe (em vez de entrar com uma senha conhecida). Na
# máquina de desenvolvimento, ponha os dois no backend/.env (fora do git, ver
# .env.example); no CI, eles vêm do PostgreSQL efêmero do job.
#
# Uso:  ./gradlew bootRun --args='--spring.profiles.active=e2e'
synergia:
  # A suíte do Cypress cria dezenas de instituições pela API, todas do mesmo IP.
  limite-cadastro-instituicao:
    maximo: 0
  # E também erra senha de propósito em vários testes, todos do mesmo IP.
  limite-login:
    falhas-por-conta: 0
    falhas-por-ip: 0
  limite-senha-instituicoes:
    falhas-por-ip: 0
spring:
  datasource:
    url: ${E2E_DB_URL:jdbc:postgresql://localhost:5432/synergia_e2e}
    username: ${E2E_DB_USERNAME}
    password: ${E2E_DB_PASSWORD}
    name: synergia_e2e
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
      generate-ddl: true
